
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>پرداخت | زیبا ارکیده</title>
    <style>
        body {
            background: #100d10;
            color: white;
            font-family: Tahoma, sans-serif;
            padding: 25px;
        }
        .box {
            max-width: 600px;
            margin: 50px auto;
            padding: 25px;
            background: #1d181d;
            border: 1px solid #e8bd62;
            border-radius: 15px;
        }
        h1 { color: #e8bd62; }
        .btn {
            display: inline-block;
            padding: 12px 20px;
            margin: 10px 5px;
            background: #e8bd62;
            color: #100d10;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>تکمیل خرید زیبا ارکیده</h1>

    <h3>محصولات سفارش شما:</h3>

    {% for item in cart %}
        <p>{{ item.name }} - تعداد: {{ item.quantity }}</p>
        <p>قیمت: {{ "{:,}".format(item.subtotal) }} تومان</p>
    {% endfor %}

    <hr>

    <h2>مبلغ نهایی: {{ "{:,}".format(total) }} تومان</h2>

    <a class="btn" href="/payment/test-success">
        پرداخت آزمایشی
    </a>

    <a class="btn" href="/payment/test-failed">
        شبیه‌سازی پرداخت ناموفق
    </a>

    <a class="btn" href="/cart">بازگشت به سبد خرید</a>
</div>
</body>
</html>
